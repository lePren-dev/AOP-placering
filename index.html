<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f3ee;--fg:#2b1d22;--card:#fff;--land:#efe6d5;--sea:#bcd6e6;--line:#7b2d43;--ap:#e3c9a8;--ok:#3f8f4f;--bad:#c0392b;--acc:#7b2d43;--chip:#7b2d43;--chipfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1519;--fg:#f1e8e3;--card:#2a2025;--land:#3a3030;--sea:#27404f;--line:#d98aa2;--ap:#5a4636;--ok:#5fb872;--bad:#e5624f;--acc:#d98aa2;--chip:#d98aa2;--chipfg:#25161b}}
:root[data-theme="dark"]{--bg:#1d1519;--fg:#f1e8e3;--card:#2a2025;--land:#3a3030;--sea:#27404f;--line:#d98aa2;--ap:#5a4636;--ok:#5fb872;--bad:#e5624f;--acc:#d98aa2;--chip:#d98aa2;--chipfg:#25161b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;padding:16px;min-height:100%}
main{max-width:660px;margin:0 auto}
h1{font-size:1.5rem;margin:.2em 0 .3em;color:var(--acc)}
p{margin:.3em 0 .9em;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--chipfg)}
button.alt{background:var(--card);color:var(--fg);border:1px solid var(--acc)}
#wrap{position:relative;width:100%;max-width:640px;aspect-ratio:1;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
svg{display:block;width:100%;height:100%}
.ap{fill:var(--ap);stroke:var(--line);stroke-width:.4;fill-opacity:.8}
.ap.ok{fill:var(--ok);fill-opacity:.55}
.lbl{font-size:2.6px;fill:var(--fg);text-anchor:middle;font-family:Georgia,serif;pointer-events:none}
.chip{background:var(--chip);color:var(--chipfg);padding:6px 10px;border-radius:999px;font-size:12px;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.3);font-family:Georgia,serif}
#wrap .chip{position:absolute;transform:translate(-50%,-50%);padding:4px 8px;font-size:11px}
.chip.drag{position:fixed;transform:translate(-50%,-50%);z-index:50;cursor:grabbing}
.chip.ok{background:var(--ok);color:#fff}.chip.bad{background:var(--bad);color:#fff}
#tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;margin:12px 0;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
#res{font-size:1.2rem;font-weight:bold;color:var(--acc)}
.hide{display:none}
.land{fill:var(--land);stroke:var(--line);stroke-width:.3}.dec{fill:var(--for);opacity:.7}.geo{font-size:2.4px;font-style:italic;fill:var(--fg);opacity:.6;text-anchor:middle;font-family:Georgia,serif;pointer-events:none}
:root{--for:#b9c9a5}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--for:#3f5240}}:root[data-theme="dark"]{--for:#3f5240}
.ctx{fill:var(--ap);fill-opacity:.3;stroke:var(--line);stroke-width:.2;stroke-dasharray:.8 .6}.cd{fill:var(--fg)}.city{font-size:2.2px;fill:var(--fg);font-family:Georgia,serif;pointer-events:none}
</style>
</head>

</section>

<p id="hint">Dra namnen från rutan under kartan och släpp dem på rätt appellation. Kartan är förenklad och schematisk. Tryck på Klar när du är färdig.</p>
<div id="wrap"><svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div>
<div id="tray"></div>
<div class="bar">
<button id="done">Klar</button>
<button id="again" class="alt hide">Välj nytt vinområde</button>
<span id="res"></span>
</div>
</section>

const $=id=>document.getElementById(id);
const svg=$("svg"),wrap=$("wrap"),tray=$("tray");
let cur=null,finished=false;
const pts=s=>s.split(" ").map(p=>p.split(",").map(Number));
function inside(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[m,n]=P[j];if((b>y)!=(n>y)&&x<(m-a)*(y-b)/(n-b)+a)c=!c}return c}
Object.keys(D).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>start(k);$("menu").appendChild(b)});
function start(k){
  cur=D[k];finished=false;
  $("start").classList.add("hide");$("game").classList.remove("hide");
  $("title").textContent=k;$("res").textContent="";$("done").classList.remove("hide");$("again").classList.add("hide");
  $("hint").classList.remove("hide");
  svg.innerHTML='<rect width="100" height="100" fill="'+(cur.land?(cur.bg?"var(--sea)":"var(--card)"):"var(--land)")+'"/>'
   +(cur.land?'<polygon class="land" points="'+cur.land+'"/>':"")
   +(cur.deco||[]).map(d=>'<polygon class="dec" points="'+d[0]+'"/><text class="geo" x="'+d[1][1]+'" y="'+d[1][2]+'">'+d[1][0]+'</text>').join("")
   +(cur.x||[]).map(p=>'<polygon class="ctx" points="'+p+'"/>').join("")+cur.rv.concat(cur.r2||[]).map(r=>'<path d="'+r[0]+'" fill="none" stroke="var(--sea)" stroke-width="'+r[1]+'" stroke-linecap="round"/>').join("")
   +cur.t.map(t=>'<text class="geo" x="'+t[1]+'" y="'+t[2]+'">'+t[0]+'</text>').join("")
   +cur.a.map((a,i)=>'<polygon class="ap" id="p'+i+'" points="'+a[1]+'"/>').join("")
   +(cur.c||[]).map(c=>'<circle cx="'+c[1]+'" cy="'+c[2]+'" r=".7" class="cd"/><text class="city" x="'+(c[1]+1.2)+'" y="'+(c[2]+.8)+'">'+c[0]+'</text>').join("");
  wrap.querySelectorAll(".chip").forEach(c=>c.remove());tray.innerHTML="";
  cur.a.map((a,i)=>i).sort(()=>Math.random()-.5).forEach(i=>{
    const c=document.createElement("div");c.className="chip";c.textContent=cur.a[i][0];c.dataset.i=i;
    c.addEventListener("pointerdown",down);tray.appendChild(c)});
}
let drag=null;
function down(e){
  if(finished)return;e.preventDefault();drag=e.currentTarget;
  drag.classList.add("drag");document.body.appendChild(drag);mv(e);
}
function mv(e){if(!drag)return;drag.style.left=e.clientX+"px";drag.style.top=e.clientY+"px"}
window.addEventListener("pointermove",mv);
window.addEventListener("pointerup",e=>{
  if(!drag)return;const c=drag;drag=null;c.classList.remove("drag");
  const r=svg.getBoundingClientRect();
  if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
    c.style.left=(e.clientX-r.left)/r.width*100+"%";c.style.top=(e.clientY-r.top)/r.height*100+"%";wrap.appendChild(c);
  }else{c.style.left=c.style.top="";tray.appendChild(c)}
});
$("done").onclick=()=>{
  finished=true;let ok=0;const chips=[...wrap.querySelectorAll(".chip")],placed=new Set();
  chips.forEach(c=>{
    const i=+c.dataset.i,r=wrap.getBoundingClientRect(),cr=c.getBoundingClientRect();
    const x=(cr.left+cr.width/2-r.left)/r.width*100,y=(cr.top+cr.height/2-r.top)/r.height*100;
    const good=inside(x,y,pts(cur.a[i][1]));
    c.classList.add(good?"ok":"bad");
    if(good){ok++;$("p"+i).classList.add("ok")}
  });
  tray.querySelectorAll(".chip").forEach(c=>c.classList.add("bad"));
  cur.a.forEach((a,i)=>{const P=pts(a[1]);const cx=P.reduce((s,p)=>s+p[0],0)/P.length,cy=P.reduce((s,p)=>s+p[1],0)/P.length;
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",cx);t.setAttribute("y",cy+4.5);t.setAttribute("class","lbl");t.textContent=a[0];svg.appendChild(t)});
  $("res").textContent="Du placerade "+ok+" av "+cur.a.length+" rätt!";
  $("done").classList.add("hide");$("again").classList.remove("hide");$("hint").classList.add("hide");
};
$("again").onclick=()=>{$("game").classList.add("hide");$("start").classList.remove("hide")};
